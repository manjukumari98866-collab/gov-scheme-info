<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gov Service Hub</title>
    <meta
      name="description"
      content="Unified Government Services and Live Information Portal"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="header-row">
        <div class="brand-wrap">
          <span class="brand-mark">🏛️</span>
          <div>
            <p class="eyebrow" data-i18n="eyebrow">Unified Government Services</p>
            <h1 data-i18n="appTitle">Gov Service Hub</h1>
          </div>
        </div>

        <button id="langToggle" class="lang-btn" type="button">हिंदी</button>
      </div>

      <p class="subtitle" data-i18n="subtitle">
        One place for cards, schemes, jobs, education, and health services.
      </p>
    </header>

    <div class="ticker-wrap">
      <span class="ticker-tag">LIVE</span>
      <marquee id="tickerText" aria-live="polite">
        Latest public service updates and government notifications.
      </marquee>
    </div>

    <main class="container">
      <section class="panel controls-panel">
        <div class="search-row">
          <input
            id="searchInput"
            type="text"
            data-i18n-placeholder="searchPlaceholder"
            placeholder="Search cards, schemes, jobs, and services"
          />
          <button id="voiceBtn" class="primary-btn" type="button" data-i18n="voiceSearch">
            Voice Search
          </button>
        </div>

        <div id="categoryTabs" class="category-tabs" aria-label="Service categories"></div>
      </section>

      <section class="panel results-panel">
        <div class="section-head">
          <h2 data-i18n="servicesTitle">Popular services</h2>
          <span id="resultCount" class="result-count">0 results</span>
        </div>

        <div id="serviceGrid" class="service-grid"></div>
      </section>
    </main>

    <button id="noticeBtn" class="floating-btn" type="button" data-i18n="liveUpdates">
      Live Updates
    </button>

    <aside id="noticeModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close="noticeModal"></div>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="noticeTitle">
        <div class="modal-head">
          <h3 id="noticeTitle" data-i18n="noticesTitle">Public notices</h3>
          <button id="closeModalBtn" class="close-btn" type="button" aria-label="Close">×</button>
        </div>
        <ul id="noticeList" class="notice-list"></ul>
      </div>
    </aside>

    <footer class="site-footer">
      <p>© 2026 Gov Service Hub • India</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
